[project]
name = "bizneslabs-backend"
version = "0.1.0"
description = "Multi-tenant AI agent platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.15,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "email-validator>=2.2,<3.0",
  "pgvector>=0.3,<1.0",
  "redis>=5.2,<6.0",
  "celery>=5.4,<6.0",
  "httpx>=0.28,<1.0",
  "tenacity>=9.0,<10.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.25,<1.0", "ruff>=0.9,<1.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
asyncio_mode = "auto"
